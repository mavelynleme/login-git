<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-container">
        <h1>Cadastro de Usuário</h1>
        <form id="cadastroForm">
            <label for="nome">Nome</label>
            <input type="text" id="nome" autocomplete="name" required>
            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" autocomplete="username" required>
            <label for="senha">Senha</label>
            <input type="password" id="senha" autocomplete="new-password" required>
            <label for="confirmarSenha">Confirmar Senha</label>
            <input type="password" id="confirmarSenha" autocomplete="new-password" required>
            <button type="submit">Cadastrar</button>
        </form>
        <p><a href="index.html">Voltar à página de login</a></p>
    </main>
</body>
</html>
